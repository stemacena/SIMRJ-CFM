<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="view-home" class="view-section">
        <div id="map" style="height: 600px;"></div>
    </div>

    <div id="view-cadastro" class="view-section container py-5" style="display:none;">
        <div class="row bg-white p-4 shadow-sm">
            <div class="col-lg-4 border-end">
                <h5>Já tenho conta</h5>
                <input id="loginEmail" class="form-control mb-2" placeholder="E-mail">
                <input id="loginPassword" class="form-control mb-3" type="password" placeholder="Senha">
                <button class="btn btn-primary w-100" onclick="loginWithEmail()">Entrar</button>
            </div>
            <div class="col-lg-8 ps-4">
                <h5>Solicitar Acesso</h5>
                <div id="sol-step1" class="wizard-step active">
                    <input type="text" id="solNome" class="form-control mb-2" placeholder="Nome Instituição *">
                    <input type="text" id="solResp" class="form-control mb-2" placeholder="Nome Responsável *">
                    <input type="email" id="solEmail" class="form-control mb-3" placeholder="E-mail *">
                    <button class="btn btn-primary" onclick="nextSolStep(2)">Avançar</button>
                </div>
                <div id="sol-step2" class="wizard-step" style="display:none;">
                    <input type="text" id="solCep" class="form-control mb-2" placeholder="CEP *" onblur="buscarCep('sol', this.value)">
                    <input type="text" id="solLogradouro" class="form-control mb-2" placeholder="Logradouro *">
                    <input type="text" id="solNumero" class="form-control mb-2" placeholder="Número *">
                    <input type="text" id="solComplemento" class="form-control mb-2" placeholder="Complemento">
                    <button class="btn btn-secondary" onclick="nextSolStep(1)">Voltar</button>
                    <button class="btn btn-primary" onclick="nextSolStep(3)">Avançar</button>
                </div>
                <div id="sol-step3" class="wizard-step" style="display:none;">
                    <button class="btn btn-success" onclick="enviarSolicitacaoAcesso()">Enviar Solicitação</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-dados-graficos" class="view-section container text-center py-5" style="display: none;">
        <img src="educativo.png" class="img-fluid d-block mx-auto mb-4" style="max-width:800px">
        <img src="gratuidade.png" class="img-fluid d-block mx-auto mb-4" style="max-width:800px">
        <img src="museologo.png" class="img-fluid d-block mx-auto mb-4" style="max-width:800px">
        <img src="tipologias.png" class="img-fluid d-block mx-auto mb-4" style="max-width:800px">
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
